<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div id="form-view">
      <header>
        <h1>Create your account</h1>
        <p>It takes less than a minute.</p>
      </header>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Jane Banda" aria-describedby="name-error">
          <p class="error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="jane@example.com" aria-describedby="email-error">
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error password-rules">
            <button type="button" class="toggle" id="toggle-password" aria-pressed="false" aria-label="Show password">Show</button>
          </div>
          <p class="error" id="password-error" aria-live="polite"></p>

          <div class="strength">
            <div class="meter"><span id="meter-bar" data-level="0"></span></div>
            <p class="strength-text" id="strength-text">Strength: enter a password</p>
          </div>

          <ul class="rules" id="password-rules" aria-label="Password requirements">
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="upper">One uppercase letter</li>
            <li data-rule="lower">One lowercase letter</li>
            <li data-rule="number">One number</li>
            <li data-rule="symbol">One symbol (such as ! @ # $)</li>
          </ul>
        </div>

        <button type="submit" class="submit">Create account</button>
      </form>
    </div>

    <div id="success-view" hidden>
      <p class="success-icon" aria-hidden="true">&#10003;</p>
      <h2>Account created!</h2>
      <p id="success-text" role="status"></p>
      <button type="button" class="submit" id="back">Back to the form</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
